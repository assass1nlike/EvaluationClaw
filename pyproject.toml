[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluationclaw"
version = "0.1.0"
description = "Automated evaluation framework for generating, quality-checking, running, and improving model benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "EvaluationClaw contributors" }]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.24.0",
    "json-repair>=0.39.0",
    "litellm>=1.55.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.19.0"]
lm-eval = ["lm-eval>=0.4.0"]
swebench = ["datasets>=2.19.0", "swebench>=3.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
evalclaw = "evalclaw.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
